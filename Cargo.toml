[package]
name = "iedb"
version = "0.1.0"
edition = "2021"

[features]
default = ["mix"]
agent = ["dep:parquet", "dep:bitcode", "dep:influxdb-line-protocol",
         "dep:reqwest", "dep:aws-sigv4", "dep:aws-credential-types", "dep:aws-smithy-runtime-api",
         "dep:crc32fast", "dep:rust-embed"]
server = ["dep:datafusion", "dep:arrow", "dep:object_store", "dep:rusqlite", "dep:parquet", "dep:rust-embed", "dep:reqwest", "dep:sqlparser", "dep:async-trait"]
mix = ["agent", "server"]

[dependencies]
# 始终依赖
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "time", "signal", "net"] }
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"
bytes = "1"
url = "2"
http-body-util = "0.1"
http = "1"

# agent feature 依赖
# pinned to 52 (same as datafusion 40's parquet) so its arrow reader
# produces the same arrow-52 RecordBatch type datafusion::arrow uses,
# and its features unify with datafusion's parquet (arrow reader included)
parquet = { version = "52", optional = true, default-features = false, features = ["snap", "flate2"] }
bitcode = { version = "0.6", optional = true, features = ["serde"] }
influxdb-line-protocol = { version = "1.0", optional = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls", "json"] }
aws-sigv4 = { version = "1", optional = true }
aws-credential-types = { version = "1", optional = true }
aws-smithy-runtime-api = { version = "1", optional = true, features = ["client"] }
crc32fast = { version = "1", optional = true }
gethostname = "0.4"

# server feature 依赖
datafusion = { version = "40", optional = true }
async-trait = { version = "0.1", optional = true }
arrow = { version = "53", optional = true }
object_store = { version = "0.11", optional = true }
rusqlite = { version = "0.31", optional = true, features = ["bundled"] }
sqlparser = { version = "0.47", optional = true }
rust-embed = { version = "8", optional = true }

[dev-dependencies]
tempfile = "3"
# 集成测试用（mix_test.rs）；独立于 agent feature 的 optional reqwest
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[[test]]
name = "mix_test"
path = "tests/integration/mix_test.rs"
